name: deploy

# Pipeline CD — build l'image backend, push sur GHCR, deploy sur le VPS.
# Cf. ADR-011 (CI/CD pipeline).
#
# Trigger : push sur main (après que le workflow ci.yml soit OK).
# Manual : workflow_dispatch pour redéployer un tag spécifique.

on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - "packages/shared/**"
      - "packages/web/**"
      - "packages/landing/**"
      - "packages/platform/**"
      - "packages/platform-web/**"
      - "Dockerfile"
      - ".dockerignore"
      - "infra/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: short SHA)"
        required: false
        type: string

# Évite les deploys concurrents (advisory lock côté DB serait suffisant
# mais autant ne pas builder/pusher pour rien)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexus-backend

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & push backend image to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ───────────────────────────────────────────────────────────────────────────
  # 1bis. Build frontend statics (web SPA + landing) et sync vers VPS
  # En parallèle du build backend (job `build`).
  # ───────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Build & sync frontend statics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @nexus/shared (deps for web)
        run: pnpm --filter @nexus/shared build

      - name: Build @nexus/web (SPA app.nexusapp.chat)
        run: pnpm --filter @nexus/web build

      - name: Build @nexus/landing (apex nexusapp.chat)
        run: pnpm --filter @nexus/landing build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync web + landing dist to VPS
        run: |
          # Crée les dossiers cible (idempotent), purge les anciens fichiers,
          # puis copie le nouveau dist. On utilise rsync via ssh pour la
          # purge atomique des fichiers obsolètes (anciens hashes Vite).
          ssh -p ${{ secrets.VPS_SSH_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /opt/nexus/static/web /opt/nexus/static/landing"

          rsync -az --delete -e "ssh -p ${{ secrets.VPS_SSH_PORT }}" \
            packages/web/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/static/web/

          rsync -az --delete -e "ssh -p ${{ secrets.VPS_SSH_PORT }}" \
            packages/landing/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/static/landing/

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Sync infra files (compose + deploy.sh + env example) to VPS
  # ───────────────────────────────────────────────────────────────────────────
  sync-infra:
    name: Sync infra files to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Charge la clé SSH dans un agent (gère multi-line + CRLF)
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync compose + deploy.sh + Caddyfiles + env example
        run: |
          # Note : on copie en gardant les modes (deploy.sh restera +x sur le VPS)
          # Le .env.production réel n'est PAS copié (déjà sur le VPS, contient les secrets)
          scp -P ${{ secrets.VPS_SSH_PORT }} \
            infra/docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/docker-compose.yml
          scp -P ${{ secrets.VPS_SSH_PORT }} \
            infra/deploy.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/deploy.sh
          scp -P ${{ secrets.VPS_SSH_PORT }} \
            infra/.env.production.example \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/.env.production.example
          # Caddyfiles pour les services static-web / static-landing
          scp -P ${{ secrets.VPS_SSH_PORT }} \
            infra/Caddyfile.web \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/Caddyfile.web
          scp -P ${{ secrets.VPS_SSH_PORT }} \
            infra/Caddyfile.landing \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/Caddyfile.landing

          # Assure le permission +x sur deploy.sh + crée les dossiers static (idempotent)
          ssh -p ${{ secrets.VPS_SSH_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod +x /opt/nexus/deploy.sh && mkdir -p /opt/nexus/static/web /opt/nexus/static/landing"

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Deploy on VPS
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: [build, build-frontend, sync-infra]

    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run deploy.sh on VPS
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/nexus && ./deploy.sh ${{ needs.build.outputs.image_tag }}"

      - name: Post-deploy healthcheck (external)
        run: |
          # Vérification depuis l'extérieur (via le DNS public)
          # Le healthcheck interne est déjà fait par deploy.sh, ceci confirme
          # que Traefik route correctement.
          set -e
          for i in $(seq 1 10); do
            if curl -fsSI "https://api.nexusapp.chat/api/v1/health" > /dev/null 2>&1; then
              echo "External health: OK"
              exit 0
            fi
            sleep 3
          done
          echo "External health: KO (Traefik routing or DNS issue)"
          exit 1
