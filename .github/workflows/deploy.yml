name: deploy

# Pipeline CD — build l'image backend, push sur GHCR, deploy sur le VPS.
# Cf. ADR-011 (CI/CD pipeline).
#
# Trigger : push sur main (après que le workflow ci.yml soit OK).
# Manual : workflow_dispatch pour redéployer un tag spécifique.

on:
  push:
    branches: [main]
    paths:
      - "packages/backend/**"
      - "packages/shared/**"
      - "Dockerfile"
      - ".dockerignore"
      - "infra/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: short SHA)"
        required: false
        type: string

# Évite les deploys concurrents (advisory lock côté DB serait suffisant
# mais autant ne pas builder/pusher pour rien)
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexus-backend

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & push backend image to GHCR
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Sync infra files (compose + deploy.sh + env example) to VPS
  # ───────────────────────────────────────────────────────────────────────────
  sync-infra:
    name: Sync infra files to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync docker-compose.yml + deploy.sh + .env.production.example
        run: |
          # Note : on copie en gardant les modes (deploy.sh restera +x sur le VPS)
          # Le .env.production réel n'est PAS copié (déjà sur le VPS, contient les secrets)
          scp -P ${{ secrets.VPS_SSH_PORT }} -i ~/.ssh/id_ed25519 \
            infra/docker-compose.prod.yml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/docker-compose.yml
          scp -P ${{ secrets.VPS_SSH_PORT }} -i ~/.ssh/id_ed25519 \
            infra/deploy.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/deploy.sh
          scp -P ${{ secrets.VPS_SSH_PORT }} -i ~/.ssh/id_ed25519 \
            infra/.env.production.example \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/nexus/.env.production.example

          # Assure le permission +x sur deploy.sh
          ssh -p ${{ secrets.VPS_SSH_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod +x /opt/nexus/deploy.sh"

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Deploy on VPS
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy on VPS
    runs-on: ubuntu-latest
    needs: [build, sync-infra]

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Run deploy.sh on VPS
        run: |
          ssh -p ${{ secrets.VPS_SSH_PORT }} -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "cd /opt/nexus && ./deploy.sh ${{ needs.build.outputs.image_tag }}"

      - name: Post-deploy healthcheck (external)
        run: |
          # Vérification depuis l'extérieur (via le DNS public)
          # Le healthcheck interne est déjà fait par deploy.sh, ceci confirme
          # que Traefik route correctement.
          set -e
          for i in $(seq 1 10); do
            if curl -fsSI "https://api.nexusapp.chat/api/v1/health" > /dev/null 2>&1; then
              echo "External health: OK"
              exit 0
            fi
            sleep 3
          done
          echo "External health: KO (Traefik routing or DNS issue)"
          exit 1
