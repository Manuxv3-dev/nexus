name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 9.15.9
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # Détecte si une PR touche le crate Tauri (ou ce fichier lui-même), pour ne
  # déclencher le job `rust` (setup système + toolchain Rust, coûteux) que
  # quand c'est pertinent. Le filtre `rust` inclut `ci.yml` : une PR qui
  # modifie le job `rust` doit le voir tourner, pas juste le voir passer par
  # défaut (skip = pas de vérification, pas de garantie). L'alternative
  # écartée serait un `paths:` au niveau `on:` (workflow séparé) — ça
  # gaterait tout `ci.yml`, pas seulement ce job, et empêcherait `typecheck`/
  # `lint`/`test`/`e2e` de tourner sur une PR qui ne touche que `src-tauri`.
  # Le choix `if:` sur output reste donc le bon (cf. MAN-134 pour un
  # précédent de garde-fou anti-dérive similaire).
  changes:
    name: Détecte les fichiers modifiés
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # dorny/paths-filter appelle l'API listFiles en mode `pull_request` —
      # sans cette permission explicite, ça ne passe que parce que le token
      # par défaut du dépôt (`default_workflow_permissions: read`) donne
      # `contents/metadata/packages: read`, jamais `pull-requests`. Un dépôt
      # privé ou un futur resserrement des permissions par défaut ferait
      # échouer l'action.
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'packages/desktop/src-tauri/**'
              - '.github/workflows/ci.yml'

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-typecheck-
      - run: pnpm typecheck

  lint:
    name: Lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-lint-
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test (Postgres + Redis service containers)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_dev_password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://nexus:nexus_dev_password@127.0.0.1:5432/nexus_test
      DATABASE_URL: postgres://nexus:nexus_dev_password@127.0.0.1:5432/nexus_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci_jwt_access_secret_at_least_32_characters_long_xyz
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_at_least_32_characters_long_xyz
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-test-
      - run: pnpm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_dev_password
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nexus:nexus_dev_password@127.0.0.1:5432/nexus_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: ci_jwt_access_secret_at_least_32_characters_long_xyz
      JWT_REFRESH_SECRET: ci_jwt_refresh_secret_at_least_32_characters_long_xyz
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @nexus/web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @nexus/web exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      # Build explicite plutôt que de laisser `webServer` du backend le faire
      # : ça sort le gros du temps de la fenêtre opaque du webServer et donne
      # un log visible. `turbo run build` (pas `pnpm --filter ... build` en
      # direct) : c'est la même commande que celle utilisée dans
      # playwright.config.ts, donc turbo reconnaît le cache et le webServer
      # backend démarre quasi instantanément au lieu de rebuilder (cf. échec
      # CI du 2026-08-02 — `pnpm --filter @nexus/shared build` en direct
      # bypassait le cache turbo, donc le webServer refaisait le build).
      - run: pnpm exec turbo run build --filter=@nexus/backend
      - run: pnpm --filter @nexus/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/web/playwright-report/
          retention-days: 7

  rust:
    name: Rust (fmt, clippy, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: packages/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      # Mêmes dépendances système que le job `build` de desktop-release.yml —
      # sans elles, la compilation échoue sur libwebkit2gtk introuvable.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust deps
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./packages/desktop/src-tauri -> target"

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Compile sans `frontendDist` construit (pas de build @nexus/web ici) :
      # vérifié localement que `cargo test`/`cargo build` ne le requièrent
      # pas — tauri-build ne lit ce chemin qu'au moment du bundle, pas de la
      # compilation ni des tests.
      #
      # `--locked` (clippy et test) : Cargo.lock est committé (cf. ticket
      # `ad86c777`) — échoue explicitement si Cargo.toml et Cargo.lock
      # divergent, plutôt que de résoudre silencieusement de nouvelles
      # versions de transitives à chaque run.
      - name: cargo test
        run: cargo test --locked
