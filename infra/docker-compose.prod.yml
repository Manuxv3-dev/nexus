# Docker Compose pour la production Nexus.
#
# Cf. ADR-011 (CI/CD pipeline), ADR-012 (topologie VPS), ADR-030 (Traefik).
#
# Déploiement :
#   - Ce fichier est copié sur le VPS dans `/opt/nexus/docker-compose.yml`
#   - Pull image GHCR via `docker compose pull`
#   - Migrations + swap orchestrés par `infra/deploy.sh`
#
# Networks :
#   - `root_default` (external) : partagé avec Traefik+n8n existant. Le
#     backend Nexus y est exposé pour que Traefik puisse router.
#   - `nexus-internal` (internal: true) : Postgres + Redis isolés. Pas
#     d'accès Internet sortant.
#
# Variables :
#   - IMAGE_TAG : tag de l'image (sha-<7chars> ou `latest`).
#                 Défaut `latest`. Surchargé par deploy.sh.
#   - GHCR_OWNER : owner du repo GHCR (default `manuxv3-dev`).
#
# Secrets (Docker secrets, mode 0600, owner nexus) :
#   - /opt/nexus/secrets/pg_user
#   - /opt/nexus/secrets/pg_password
#
# Config app (.env.production, mode 0600, owner nexus) :
#   - /opt/nexus/.env.production
#     (template : infra/.env.production.example)

x-image-backend: &image-backend
  image: ghcr.io/${GHCR_OWNER:-manuxv3-dev}/nexus-backend:${IMAGE_TAG:-latest}

services:
  # ───────────────────────────────────────────────────────────────────────
  # API + WebSocket — exposé via Traefik
  # ───────────────────────────────────────────────────────────────────────
  backend:
    <<: *image-backend
    container_name: nexus-backend
    env_file: ./.env.production
    networks: [root_default, nexus-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.services.nexus-api.loadbalancer.server.port=3000"
      # ── Routes principales ───────────────────────────────────────────
      # API + WebSocket sur api.nexusapp.chat (tout le trafic)
      - "traefik.http.routers.nexus-api.rule=Host(`api.nexusapp.chat`)"
      - "traefik.http.routers.nexus-api.entrypoints=web,websecure"
      - "traefik.http.routers.nexus-api.tls=true"
      - "traefik.http.routers.nexus-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.nexus-api.middlewares=nexus-headers@docker"
      # Pages publiques SSR (Fastify) — `/e/`, `/p/`, `/d/`, `/t/`, `/l/`
      - "traefik.http.routers.nexus-public.rule=Host(`nexusapp.chat`) && (PathPrefix(`/e/`) || PathPrefix(`/p/`) || PathPrefix(`/d/`) || PathPrefix(`/t/`) || PathPrefix(`/l/`))"
      - "traefik.http.routers.nexus-public.entrypoints=web,websecure"
      - "traefik.http.routers.nexus-public.tls=true"
      - "traefik.http.routers.nexus-public.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.nexus-public.middlewares=nexus-headers@docker"
      - "traefik.http.routers.nexus-public.service=nexus-api"
      # ── Backend depuis le SPA web (calls relatifs `/api/v1` et `/ws`) ─
      - "traefik.http.routers.nexus-api-web.rule=Host(`app.nexusapp.chat`) && (PathPrefix(`/api/`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.nexus-api-web.entrypoints=web,websecure"
      - "traefik.http.routers.nexus-api-web.tls=true"
      - "traefik.http.routers.nexus-api-web.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.nexus-api-web.middlewares=nexus-headers@docker"
      - "traefik.http.routers.nexus-api-web.service=nexus-api"
      # ── Backend depuis la landing (waitlist, etc.) ───────────────────
      - "traefik.http.routers.nexus-api-landing.rule=Host(`nexusapp.chat`) && PathPrefix(`/api/`)"
      - "traefik.http.routers.nexus-api-landing.entrypoints=web,websecure"
      - "traefik.http.routers.nexus-api-landing.tls=true"
      - "traefik.http.routers.nexus-api-landing.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.nexus-api-landing.middlewares=nexus-headers@docker"
      - "traefik.http.routers.nexus-api-landing.service=nexus-api"
      # ── Middleware security headers (partagé) ────────────────────────
      - "traefik.http.middlewares.nexus-headers.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.nexus-headers.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.nexus-headers.headers.STSPreload=true"
      - "traefik.http.middlewares.nexus-headers.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.nexus-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.nexus-headers.headers.referrerPolicy=strict-origin-when-cross-origin"

  # ───────────────────────────────────────────────────────────────────────
  # Worker BullMQ — rappels d'événements (J-1, J-3, etc.)
  # ───────────────────────────────────────────────────────────────────────
  worker-reminders:
    <<: *image-backend
    container_name: nexus-worker-reminders
    env_file: ./.env.production
    networks: [nexus-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["node", "dist/workers/event-reminders.js"]
    labels:
      - "traefik.enable=false"

  # ───────────────────────────────────────────────────────────────────────
  # Worker BullMQ — purge périodique des notifications expirées
  # ───────────────────────────────────────────────────────────────────────
  worker-purge:
    <<: *image-backend
    container_name: nexus-worker-purge
    env_file: ./.env.production
    networks: [nexus-internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["node", "dist/workers/notifications-purge.js"]
    labels:
      - "traefik.enable=false"

  # ───────────────────────────────────────────────────────────────────────
  # Postgres 16 (volume persistant nexus-pgdata)
  # ───────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER_FILE: /run/secrets/pg_user
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
    volumes:
      - nexus-pgdata:/var/lib/postgresql/data
    secrets:
      - pg_user
      - pg_password
    networks: [nexus-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$(cat /run/secrets/pg_user)" -d nexus']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=false"

  # ───────────────────────────────────────────────────────────────────────
  # Static SPA — app.nexusapp.chat (web)
  # Servi par caddy:alpine, fallback /index.html pour le routing client
  # ───────────────────────────────────────────────────────────────────────
  static-web:
    image: caddy:2-alpine
    container_name: nexus-static-web
    restart: unless-stopped
    networks: [root_default]
    volumes:
      - /opt/nexus/static/web:/srv:ro
      - ./Caddyfile.web:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.services.nexus-web.loadbalancer.server.port=80"
      # SPA web sur app.nexusapp.chat — priorité < routes API (rules + spécifiques gagnent)
      - "traefik.http.routers.nexus-web.rule=Host(`app.nexusapp.chat`)"
      - "traefik.http.routers.nexus-web.entrypoints=web,websecure"
      - "traefik.http.routers.nexus-web.tls=true"
      - "traefik.http.routers.nexus-web.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.nexus-web.middlewares=nexus-headers@docker"
      - "traefik.http.routers.nexus-web.service=nexus-web"

  # ───────────────────────────────────────────────────────────────────────
  # Static landing — nexusapp.chat (apex)
  # Catch-all : Traefik prend les paths /api/* et /e|p|d|t|l/* sur ce host
  # via les routers backend (priorité plus haute), reste atterrit ici.
  # ───────────────────────────────────────────────────────────────────────
  static-landing:
    image: caddy:2-alpine
    container_name: nexus-static-landing
    restart: unless-stopped
    networks: [root_default]
    volumes:
      - /opt/nexus/static/landing:/srv:ro
      - ./Caddyfile.landing:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.services.nexus-landing.loadbalancer.server.port=80"
      - "traefik.http.routers.nexus-landing.rule=Host(`nexusapp.chat`)"
      - "traefik.http.routers.nexus-landing.entrypoints=web,websecure"
      - "traefik.http.routers.nexus-landing.tls=true"
      - "traefik.http.routers.nexus-landing.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.nexus-landing.middlewares=nexus-headers@docker"
      - "traefik.http.routers.nexus-landing.service=nexus-landing"

  # ───────────────────────────────────────────────────────────────────────
  # Redis 7 (volume persistant nexus-redis-data)
  # ───────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - nexus-redis-data:/data
    networks: [nexus-internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=false"

# ─────────────────────────────────────────────────────────────────────────────
# Volumes persistants
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  nexus-pgdata:
    name: nexus-pgdata
  nexus-redis-data:
    name: nexus-redis-data

# ─────────────────────────────────────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────────────────────────────────────
networks:
  # Réseau du compose root (Traefik + n8n) — on s'y greffe
  root_default:
    external: true
  # Réseau interne Nexus — services métier isolés (pas d'Internet sortant)
  nexus-internal:
    name: nexus-internal
    driver: bridge
    internal: true

# ─────────────────────────────────────────────────────────────────────────────
# Secrets Docker (fichiers locaux mode 0600 sur le VPS)
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  pg_user:
    file: ./secrets/pg_user
  pg_password:
    file: ./secrets/pg_password
