<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Nexus — Poll Panel killer feature (état actuel)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_shared.css">
<style>
  body { display: flex; height: 100vh; }
  .panel-root {
    flex: 1;
    background: var(--bg);
    display: flex; flex-direction: column;
  }
  .panel-header {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-icon-wrap {
    width: 36px; height: 36px;
    border-radius: var(--radius-sm);
    background: var(--info-bg);
    color: var(--info);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .panel-title { font-size: 16px; font-weight: 700; letter-spacing: -0.02em; color: var(--fg); }
  .panel-subtitle { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }
  .copy-link-btn {
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px;
    background: var(--elevated);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    color: var(--fg-muted);
    font-size: 12px; font-weight: 500;
    cursor: pointer; font-family: inherit;
  }

  .options { padding: 16px 20px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .option {
    background: var(--elevated);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    padding: 12px 14px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    text-align: left;
    font-family: inherit;
    color: inherit;
    transition: border-color 0.2s;
  }
  .option.voted {
    border-color: rgba(144, 128, 248, 0.27);
  }
  .option-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    border-radius: var(--radius-sm);
    background: var(--fg);
    opacity: 0.03;
    transition: width 0.4s;
  }
  .option.voted .option-fill {
    background: var(--primary);
    opacity: 0.12;
  }
  .option-row {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;
  }
  .option-left { display: flex; align-items: center; gap: 10px; }
  .option-text { font-size: 14px; font-weight: 600; color: var(--fg); }
  .option-right { display: flex; align-items: center; gap: 8px; }
  .voters { display: flex; }
  .voters .avatar { margin-left: -6px; border: 2px solid var(--elevated); }
  .voters .avatar:first-child { margin-left: 0; }
  .pct { font-size: 13px; font-weight: 700; color: var(--fg); min-width: 40px; text-align: right; }
  .check-icon {
    width: 18px; height: 18px;
    border-radius: 9px;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
  }
</style>
</head>
<body>
  <section class="panel-root">

    <header class="panel-header">
      <div class="panel-icon-wrap">
        <svg style="stroke:currentColor;stroke-width:1.5;fill:none;" width="18" height="18" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      </div>
      <div>
        <div class="panel-title">Pizza ou sushis pour samedi ?</div>
        <div class="panel-subtitle">Choix unique · 5 votes</div>
      </div>
      <button class="copy-link-btn">
        <svg style="stroke:currentColor;stroke-width:1.5;fill:none;" width="14" height="14" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Copier le lien
      </button>
    </header>

    <div class="options">

      <button class="option voted">
        <span class="option-fill" style="width: 60%;"></span>
        <div class="option-row">
          <div class="option-left">
            <span class="check-icon">✓</span>
            <span class="option-text">🍕 Pizza Napolitaine</span>
          </div>
          <div class="option-right">
            <div class="voters">
              <span class="avatar" style="width:22px;height:22px;font-size:10px;background:#34d399;">L</span>
              <span class="avatar" style="width:22px;height:22px;font-size:10px;background:#fbbf24;">T</span>
              <span class="avatar" style="width:22px;height:22px;font-size:10px;background:#7c5cfc;">M</span>
            </div>
            <span class="pct">60%</span>
          </div>
        </div>
      </button>

      <button class="option">
        <span class="option-fill" style="width: 40%;"></span>
        <div class="option-row">
          <div class="option-left">
            <span class="option-text">🍣 Sushis</span>
          </div>
          <div class="option-right">
            <div class="voters">
              <span class="avatar" style="width:22px;height:22px;font-size:10px;background:#60a5fa;">S</span>
              <span class="avatar" style="width:22px;height:22px;font-size:10px;background:#f87171;">M</span>
            </div>
            <span class="pct">40%</span>
          </div>
        </div>
      </button>

      <button class="option">
        <span class="option-fill" style="width: 0%;"></span>
        <div class="option-row">
          <div class="option-left">
            <span class="option-text">🌮 Tacos</span>
          </div>
          <div class="option-right">
            <span class="pct">0%</span>
          </div>
        </div>
      </button>

      <button class="option">
        <span class="option-fill" style="width: 0%;"></span>
        <div class="option-row">
          <div class="option-left">
            <span class="option-text">🍔 Burger</span>
          </div>
          <div class="option-right">
            <span class="pct">0%</span>
          </div>
        </div>
      </button>

    </div>
  </section>
</body>
</html>
