<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo nexus — référence canonique (mêmes coords que `Logo.tsx`).

  3 orbites entrelacées (rotation 60°/120°) symbolisent la coordination,
  3 noyaux Apple System Colors représentent les 3 features clés :
    · #007AFF systemBlue   — Events  (planification)
    · #34C759 systemGreen  — Todos   (réalisation)
    · #5856D6 systemIndigo — Chat / brand (messagerie / fil conducteur)

  Orbites : `#ffffff` opacity 0.32 — fixé pour la rasterisation PNG/ICO
  (rendu prévu sur fond sombre dominant : taskbar Windows dark, dock mac
  dark, iOS dark). Le composant `Logo.tsx` côté web utilise `currentColor`
  qui s'adapte automatiquement au thème via CSS — comportement préservé.

  viewBox 80×80 conservé (cohérent avec Logo.tsx et la mémoire visuelle
  du design system v2 ADR-021).
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 80 80"
  width="80"
  height="80"
  fill="none"
  role="img"
  aria-label="nexus"
>
  <!-- Orbites entrelacées (3 ellipses, rotation 0°/60°/120° autour du centre) -->
  <ellipse cx="40" cy="40" rx="27" ry="10" fill="none" stroke="#ffffff" stroke-width="1.75" opacity="0.32" />
  <ellipse cx="40" cy="40" rx="27" ry="10" fill="none" stroke="#ffffff" stroke-width="1.75" opacity="0.32" transform="rotate(60 40 40)" />
  <ellipse cx="40" cy="40" rx="27" ry="10" fill="none" stroke="#ffffff" stroke-width="1.75" opacity="0.32" transform="rotate(120 40 40)" />
  <!-- Noyaux Apple System Colors (Blue / Green / Indigo) -->
  <circle cx="67" cy="40" r="7.5" fill="#007AFF" />
  <circle cx="26.5" cy="63.4" r="7.5" fill="#34C759" />
  <circle cx="26.5" cy="16.6" r="7.5" fill="#5856D6" />
</svg>
