[package]
name = "nexus"
version = "0.0.0"
description = "Nexus desktop shell"
authors = ["Manu Auricoste <emmanuel.auricoste@gmail.com>"]
edition = "2021"

# Le binaire main + une lib réutilisable (préparé pour mobile Tauri 2 — l'entry
# point mobile importe `nexus_lib::run()` au lieu d'avoir un `fn main()`).
[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Optimisations release : binaire plus petit (LTO + opt-level=s + strip).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
