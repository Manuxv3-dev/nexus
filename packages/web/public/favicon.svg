<?xml version="1.0" encoding="UTF-8"?>
<!--
  Logo Nexus — symbole "full" (mark with connecting lines).
  Usage : favicon onglet, splash screen, hero landing, contextes >= 32px.
  Concept : trois nœuds violets connectés en triangle équilatéral = "nexus".
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 80 80"
  width="80"
  height="80"
  role="img"
  aria-label="Nexus logo"
>
  <!-- Lignes de connexion (triangle équilatéral, opacité 0.6) -->
  <line x1="26" y1="26" x2="54" y2="26" stroke="#7c5cfc" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="26" y1="26" x2="40" y2="54" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <line x1="54" y1="26" x2="40" y2="54" stroke="#c084fc" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  <!-- Nœuds (3 cercles, 3 nuances de violet) -->
  <circle cx="26" cy="26" r="8" fill="#7c5cfc" />
  <circle cx="54" cy="26" r="8" fill="#a78bfa" />
  <circle cx="40" cy="54" r="8" fill="#c084fc" />
</svg>
